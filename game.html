<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Betas Through Time: Arena</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/eras.css">
</head>
<body class="era era-medieval">
    <header class="hud">
        <div class="era-banner">
            <h1>Betas Through Time</h1>
            <p>Fase atual: <span id="era-label">Era Medieval</span></p>
        </div>
        <div class="scoreboard">
            <article id="player-panel-1" class="player-panel">
                <h2 class="player-name" id="player-name-1">Jogador 1</h2>
                <p class="player-class" id="player-class-1">Classe</p>
                <div class="hp-bar"><div class="hp-fill" id="hp-fill-1"></div></div>
                <span class="hp-value" id="hp-value-1">120 / 120</span>
            </article>
            <article id="player-panel-2" class="player-panel">
                <h2 class="player-name" id="player-name-2">Jogador 2</h2>
                <p class="player-class" id="player-class-2">Classe</p>
                <div class="hp-bar"><div class="hp-fill" id="hp-fill-2"></div></div>
                <span class="hp-value" id="hp-value-2">120 / 120</span>
            </article>
        </div>
    </header>

    <main class="arena">
        <section class="fighters">
            <div id="fighter1" class="fighter sprite-left"></div>
            <div id="fighter2" class="fighter sprite-right"></div>
            <div id="brutal" class="brutal-banner">BRUTAL!</div>
        </section>
        <aside class="abilities">
            <h3>Habilidades disponíveis</h3>
            <ul id="habilidades-list" class="habilidades-list"></ul>
        </aside>
        <section class="controls">
            <div class="buttons">
                <button data-action="atacar" class="action-button">Atacar</button>
                <button data-action="defender" class="action-button">Defender</button>
                <button data-action="provocar" class="action-button">Provocar</button>
                <button data-action="viajar" class="action-button" id="time-travel" disabled>Viajar no Tempo</button>
            </div>
            <div class="log">
                <h3>Log de Ações</h3>
                <table id="log-table" class="log-table">
                    <thead>
                        <tr>
                            <th>Turno</th>
                            <th>Jogador</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="footer-message">
        <p>Que vença o betinha com o mogging mais impecável.</p>
    </footer>

    <script type="module" src="js/eventos.js"></script>
</body>
</html>
