<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Betas Through Space: The Mogging Chronicles</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="index-body">
    <main class="menu-container">
        <section class="menu-card">
            <h1>Betas Through Space: The Mogging Chronicles</h1>
            <p class="menu-intro">Dois betinhas vagando pela galáxia, buscando o drip supremo em cada planeta visitado.</p>
            <form id="setup-form" action="game.html" method="get" class="setup-form">
                <div class="field-group">
                    <label for="player1">Nome do Jogador 1</label>
                    <input id="player1" name="p1" type="text" required placeholder="Beta Cósmico 1">
                </div>
                <div class="field-group">
                    <label for="classe1">Classe inicial</label>
                    <select id="classe1" name="c1">
                        <option value="cavaleiro">Cavaleiro</option>
                        <option value="bandido">Bandido</option>
                        <option value="ciborgue">Ciborgue</option>
                    </select>
                </div>
                <div class="field-group">
                    <label for="player2">Nome do Jogador 2</label>
                    <input id="player2" name="p2" type="text" required placeholder="Beta Cósmico 2">
                </div>
                <div class="field-group">
                    <label for="classe2">Classe inicial</label>
                    <select id="classe2" name="c2">
                        <option value="cavaleiro">Cavaleiro</option>
                        <option value="bandido">Bandido</option>
                        <option value="ciborgue">Ciborgue</option>
                    </select>
                </div>
                <button type="submit" class="start-button">Iniciar Jogo</button>
            </form>
        </section>
    </main>
</body>
</html>
